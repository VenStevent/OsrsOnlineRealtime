name: Collect OSRS player count
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect snapshot
        env:
          COLLECT_URL: ${{ secrets.COLLECT_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            -H "x-collect-secret: ${COLLECT_SECRET}" \
            "${COLLECT_URL}"
